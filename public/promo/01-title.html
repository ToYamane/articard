<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>ArtiCard - タイトル画像</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1280px;
    height: 720px;
    overflow: hidden;
    font-family: 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  }

  .container {
    width: 1280px;
    height: 720px;
    background: linear-gradient(135deg, #1e0a3c 0%, #2d1b69 25%, #1a1a6e 50%, #0d2b5e 75%, #0a1628 100%);
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Ambient glow effects */
  .container::before {
    content: '';
    position: absolute;
    top: -100px;
    left: -100px;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(139, 92, 246, 0.3) 0%, transparent 70%);
    pointer-events: none;
  }

  .container::after {
    content: '';
    position: absolute;
    bottom: -150px;
    right: -100px;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(59, 130, 246, 0.25) 0%, transparent 70%);
    pointer-events: none;
  }

  /* Sparkle particles */
  .sparkle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: white;
    border-radius: 50%;
    opacity: 0.6;
    animation: twinkle 3s ease-in-out infinite;
  }

  .sparkle:nth-child(1) { top: 8%; left: 15%; animation-delay: 0s; }
  .sparkle:nth-child(2) { top: 12%; right: 20%; animation-delay: 0.5s; width: 3px; height: 3px; }
  .sparkle:nth-child(3) { top: 25%; left: 8%; animation-delay: 1s; width: 5px; height: 5px; }
  .sparkle:nth-child(4) { bottom: 20%; right: 10%; animation-delay: 1.5s; }
  .sparkle:nth-child(5) { bottom: 30%; left: 22%; animation-delay: 2s; width: 3px; height: 3px; }
  .sparkle:nth-child(6) { top: 40%; right: 8%; animation-delay: 0.8s; width: 5px; height: 5px; }
  .sparkle:nth-child(7) { top: 60%; left: 5%; animation-delay: 1.3s; }
  .sparkle:nth-child(8) { bottom: 10%; left: 40%; animation-delay: 2.2s; width: 3px; height: 3px; }

  @keyframes twinkle {
    0%, 100% { opacity: 0.3; transform: scale(1); }
    50% { opacity: 0.8; transform: scale(1.5); }
  }

  /* Background card decorations */
  .bg-card {
    position: absolute;
    width: 220px;
    height: 330px;
    border-radius: 14px;
    overflow: hidden;
    opacity: 0.18;
    filter: blur(2px);
    box-shadow: 0 0 40px rgba(139, 92, 246, 0.3);
  }

  .bg-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .bg-card-1 {
    top: -20px;
    left: 20px;
    transform: rotate(-18deg);
    opacity: 0.16;
  }

  .bg-card-2 {
    top: 10px;
    right: 30px;
    transform: rotate(15deg);
    opacity: 0.2;
  }

  .bg-card-3 {
    bottom: -30px;
    left: 80px;
    transform: rotate(10deg);
    opacity: 0.17;
  }

  .bg-card-4 {
    bottom: -20px;
    right: 60px;
    transform: rotate(-12deg);
    opacity: 0.19;
  }

  /* Center content */
  .center-content {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .icon-logo {
    width: 240px;
    height: auto;
    filter: drop-shadow(0 0 30px rgba(139, 92, 246, 0.6));
  }

  .text-logo {
    width: 700px;
    height: auto;
    filter: drop-shadow(0 0 25px rgba(139, 92, 246, 0.5));
    margin-top: -10px;
  }

  .catchcopy {
    margin-top: 20px;
    font-size: 42px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.95);
    letter-spacing: 0.15em;
    text-shadow:
      0 0 30px rgba(139, 92, 246, 0.6),
      0 0 60px rgba(139, 92, 246, 0.3),
      0 2px 6px rgba(0, 0, 0, 0.5);
  }

  .subtitle {
    margin-top: 8px;
    font-size: 22px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.55);
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  /* Decorative line */
  .deco-line {
    width: 360px;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(139, 92, 246, 0.6), rgba(96, 165, 250, 0.6), transparent);
    margin-top: 12px;
    border-radius: 1px;
  }
</style>
</head>
<body>
<div class="container">
  <!-- Sparkle particles -->
  <div class="sparkle"></div>
  <div class="sparkle"></div>
  <div class="sparkle"></div>
  <div class="sparkle"></div>
  <div class="sparkle"></div>
  <div class="sparkle"></div>
  <div class="sparkle"></div>
  <div class="sparkle"></div>

  <!-- Background cards -->
  <div class="bg-card bg-card-1">
    <img src="../../tmp/card-test/card_front_common.jpg" alt="">
  </div>
  <div class="bg-card bg-card-2">
    <img src="../../tmp/card-test/card_front_rare.jpg" alt="">
  </div>
  <div class="bg-card bg-card-3">
    <img src="../../tmp/card-test/card_front_super_rare.jpg" alt="">
  </div>
  <div class="bg-card bg-card-4">
    <img src="../../tmp/card-test/card_front_legend.jpg" alt="">
  </div>

  <!-- Center content -->
  <div class="center-content">
    <img src="../logo/icon.png" alt="ArtiCard Icon" class="icon-logo">
    <img src="../logo/text.png" alt="ArtiCard" class="text-logo">
    <div class="deco-line"></div>
    <div class="catchcopy">学んで集める、AIカードコレクション</div>
    <div class="subtitle">AI-Powered Learning Card Collection</div>
  </div>
</div>
</body>
</html>
