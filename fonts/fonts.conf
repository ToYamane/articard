<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Local fonts directory -->
  <dir>/app/fonts</dir>

  <!-- Font cache directory -->
  <cachedir>/tmp/fontconfig-cache</cachedir>

  <!-- Alias mappings for font families -->
  <alias>
    <family>Noto Sans JP</family>
    <prefer><family>Noto Sans JP</family></prefer>
  </alias>
  <alias>
    <family>Noto Sans CJK JP</family>
    <prefer><family>Noto Sans JP</family></prefer>
  </alias>
  <alias>
    <family>Noto Serif JP</family>
    <prefer><family>Noto Serif JP</family></prefer>
  </alias>
  <alias>
    <family>Noto Serif CJK JP</family>
    <prefer><family>Noto Serif JP</family></prefer>
  </alias>
  <alias>
    <family>Dela Gothic One</family>
    <prefer><family>Dela Gothic One</family></prefer>
  </alias>
  <alias>
    <family>Kaisei Tokumin</family>
    <prefer><family>Kaisei Tokumin</family></prefer>
  </alias>
  <alias>
    <family>Reggae One</family>
    <prefer><family>Reggae One</family></prefer>
  </alias>
  <alias>
    <family>Yuji Syuku</family>
    <prefer><family>Yuji Syuku</family></prefer>
  </alias>
  <alias>
    <family>Kiwi Maru</family>
    <prefer><family>Kiwi Maru</family></prefer>
  </alias>
  <alias>
    <family>Hachi Maru Pop</family>
    <prefer><family>Hachi Maru Pop</family></prefer>
  </alias>
  <alias>
    <family>DotGothic16</family>
    <prefer><family>DotGothic16</family></prefer>
  </alias>
  <alias>
    <family>Stick</family>
    <prefer><family>Stick</family></prefer>
  </alias>
</fontconfig>
