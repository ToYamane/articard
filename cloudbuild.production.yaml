# ===================================
# Articard Production Deployment
# Manual trigger for production releases
# ===================================

steps:
  # Step 1: Test
  - name: 'node:20-alpine'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        npm ci
        npm run type-check
        npm run lint
        npm run test
    id: 'test'

  # Step 2: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker build \
          --build-arg NEXT_PUBLIC_FIREBASE_API_KEY=$$NEXT_PUBLIC_FIREBASE_API_KEY \
          --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=$$NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN \
          --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID=$$NEXT_PUBLIC_FIREBASE_PROJECT_ID \
          --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=$$NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET \
          --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=$$NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID \
          --build-arg NEXT_PUBLIC_FIREBASE_APP_ID=$$NEXT_PUBLIC_FIREBASE_APP_ID \
          --build-arg NEXT_PUBLIC_APP_URL=${_APP_URL} \
          --build-arg NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=$$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY \
          -t gcr.io/$PROJECT_ID/articard:$SHORT_SHA \
          -t gcr.io/$PROJECT_ID/articard:latest \
          .
    secretEnv:
      - 'NEXT_PUBLIC_FIREBASE_API_KEY'
      - 'NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN'
      - 'NEXT_PUBLIC_FIREBASE_PROJECT_ID'
      - 'NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET'
      - 'NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID'
      - 'NEXT_PUBLIC_FIREBASE_APP_ID'
      - 'NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY'
    id: 'build'
    waitFor: ['test']

  # Step 3: Push image to GCR
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/articard'
    id: 'push'
    waitFor: ['build']

  # Step 4: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'articard'
      - '--image=gcr.io/$PROJECT_ID/articard:$SHORT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--add-cloudsql-instances=${_CLOUD_SQL_INSTANCE}'
      - '--set-env-vars=NODE_ENV=production'
      - '--set-env-vars=NEXT_PUBLIC_APP_URL=${_APP_URL}'
      - '--set-env-vars=GCS_BUCKET_NAME=${_GCS_BUCKET}'
      - '--set-secrets=DATABASE_URL=articard-database-url:latest'
      - '--set-secrets=OPENAI_API_KEY=articard-openai-key:latest'
      - '--set-secrets=BFL_API_KEY=articard-bfl-key:latest'
      - '--set-secrets=GOOGLE_GEMINI_API_KEY=articard-gemini-key:latest'
      - '--set-secrets=NEXT_PUBLIC_FIREBASE_API_KEY=articard-firebase-api-key:latest'
      - '--set-secrets=NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=articard-firebase-auth-domain:latest'
      - '--set-secrets=NEXT_PUBLIC_FIREBASE_PROJECT_ID=articard-firebase-project-id:latest'
      - '--set-secrets=NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=articard-firebase-storage-bucket:latest'
      - '--set-secrets=NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=articard-firebase-messaging-sender-id:latest'
      - '--set-secrets=NEXT_PUBLIC_FIREBASE_APP_ID=articard-firebase-app-id:latest'
      - '--set-secrets=FIREBASE_ADMIN_PROJECT_ID=articard-firebase-admin-project-id:latest'
      - '--set-secrets=FIREBASE_ADMIN_CLIENT_EMAIL=articard-firebase-admin-email:latest'
      - '--set-secrets=FIREBASE_ADMIN_PRIVATE_KEY=articard-firebase-admin-key:latest'
      - '--set-secrets=STRIPE_SECRET_KEY=articard-stripe-secret-key:latest'
      - '--set-secrets=STRIPE_WEBHOOK_SECRET=articard-stripe-webhook-secret:latest'
      - '--set-secrets=NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=articard-stripe-publishable-key:latest'
      - '--set-secrets=STRIPE_PRICE_PLUS=articard-stripe-price-plus:latest'
      - '--set-secrets=STRIPE_PRICE_PREMIUM=articard-stripe-price-premium:latest'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--min-instances=1'
      - '--max-instances=50'
      - '--concurrency=100'
      - '--timeout=300s'
    id: 'deploy'
    waitFor: ['push']

  # Step 5: Verify deployment
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        echo "Verifying deployment..."
        SERVICE_URL=$(gcloud run services describe articard --region=${_REGION} --format='value(status.url)')
        echo "Service URL: $${SERVICE_URL}"

        # Health check with retries
        for i in 1 2 3 4 5; do
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$${SERVICE_URL}/api/health" || echo "000")
          if [ "$${STATUS}" = "200" ]; then
            echo "Health check passed!"
            exit 0
          fi
          echo "Attempt $${i}: status $${STATUS}, retrying in 10s..."
          sleep 10
        done
        echo "Warning: Health check did not return 200 after 5 attempts"
        exit 1
    id: 'verify'
    waitFor: ['deploy']

# Substitutions
substitutions:
  _REGION: 'asia-northeast1'
  _APP_URL: 'https://articard.app'
  _CLOUD_SQL_INSTANCE: 'articard-ff673:asia-northeast1:articard-db'
  _GCS_BUCKET: 'articard-ff673.appspot.com'

# Build options
options:
  logging: CLOUD_LOGGING_ONLY

# Secrets from Secret Manager (for build-time args)
availableSecrets:
  secretManager:
    - versionName: 'projects/$PROJECT_ID/secrets/articard-firebase-api-key/versions/latest'
      env: 'NEXT_PUBLIC_FIREBASE_API_KEY'
    - versionName: 'projects/$PROJECT_ID/secrets/articard-firebase-auth-domain/versions/latest'
      env: 'NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN'
    - versionName: 'projects/$PROJECT_ID/secrets/articard-firebase-project-id/versions/latest'
      env: 'NEXT_PUBLIC_FIREBASE_PROJECT_ID'
    - versionName: 'projects/$PROJECT_ID/secrets/articard-firebase-storage-bucket/versions/latest'
      env: 'NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET'
    - versionName: 'projects/$PROJECT_ID/secrets/articard-firebase-messaging-sender-id/versions/latest'
      env: 'NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID'
    - versionName: 'projects/$PROJECT_ID/secrets/articard-firebase-app-id/versions/latest'
      env: 'NEXT_PUBLIC_FIREBASE_APP_ID'
    - versionName: 'projects/$PROJECT_ID/secrets/articard-stripe-publishable-key/versions/latest'
      env: 'NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY'

timeout: '1200s'
