# ===================================
# Articard Cloud Build Configuration
# Builds and deploys to Cloud Run
# ===================================

steps:
  # Step 1: Install dependencies and run tests
  - name: 'node:20-alpine'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        npm ci
        npm run type-check
        npm run lint
        npm run test -- --passWithNoTests
    id: 'test'

  # Step 2: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/articard:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/articard:latest'
      - '.'
    id: 'build'
    waitFor: ['test']

  # Step 3: Push Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/articard:$COMMIT_SHA'
    id: 'push'
    waitFor: ['build']

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/articard:latest'
    waitFor: ['push']

  # Step 4: Deploy to Cloud Run (Staging)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'articard-staging'
      - '--image=gcr.io/$PROJECT_ID/articard:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=NODE_ENV=production'
      - '--set-secrets=DATABASE_URL=articard-database-url:latest'
      - '--set-secrets=OPENAI_API_KEY=articard-openai-key:latest'
      - '--set-secrets=FLUX_API_KEY=articard-flux-key:latest'
      - '--set-secrets=NEXT_PUBLIC_FIREBASE_API_KEY=articard-firebase-api-key:latest'
      - '--set-secrets=FIREBASE_ADMIN_PRIVATE_KEY=articard-firebase-admin-key:latest'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--concurrency=80'
      - '--timeout=60s'
    id: 'deploy-staging'
    waitFor: ['push']

# Substitutions (can be overridden)
substitutions:
  _REGION: 'asia-northeast1'

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

# Images to store in Container Registry
images:
  - 'gcr.io/$PROJECT_ID/articard:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/articard:latest'

# Timeout for the entire build
timeout: '1200s'
